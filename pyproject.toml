[build-system]
requires = ["setuptools==75.8.2"]
build-backend = "setuptools.build_meta"

[project]
name = "repoaudit"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "anthropic[vertex]==0.52.0",
    "bandit==1.8.3",
    "click==8.1.8",
    "detect-secrets==1.5.0",
    "interrogate==1.7.0",
    "lizard==1.17.10",
    "pip-audit==2.9.0",
    "pyyaml==6.0.2",
    "radon==6.0.1",
    "ruff==0.9.10",
]

[project.scripts]
repoaudit = "repoaudit.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["repoaudit*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 88
